      operationId: get-export-suppliers-supplier_id-prices
      tags:
        - suppliers
      description: 'Returns the current fuelstation prices for one or all fuelstations of a supplier (supplier_id). Optionally filtered by a specific fuelstation (fuelstation_id) and a reference date (from_date). For each product, the most recent active price is returned split by service mode (self-service and attended). If from_date is provided, only prices activated after that date are considered.'
