                  type: string
                  description: IS code assigned to the fuel station
                product_id:
                  type: integer
                  description: The product identifier from enum table on the top documentation
                start_datetime:
                  type: string
                  description: 'format start time: ISO-8601'
                unit_price:
                  type: number
                  description: Unit price related to the price. Decimal value with max 3 decimal digits
            examples:
              Example 1:
                value:
                  fuelstation_code: string
                  product_id: 0
                  start_datetime: string
