      operationId: put-export-prices
      description: |
        Save the price information in order to schedule it on Overview and send to the fuel station PC.
        If there is already an applied price, the API will check the difference with the new price, if it is greater than 30%, a conflict error will be return. This check could be skipped with force attribute equal to "true".
        A price can't be edited if it is already sent to fuel station. So if the status is already >= 2, the API will return a conflict.
      x-stoplight:
        id: l4j3ys3qm9b2x
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
