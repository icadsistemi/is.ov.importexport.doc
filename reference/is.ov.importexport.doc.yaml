  contact:
    email: internal-dev-team@icadsistemi.com
    name: Dev team internal
servers:
  - url: 'https://mxp-import-export-ov.dev.icadsistemi.com/v1'
    description: development
  - url: 'https://mxp-import-export-ov.prod.icadsistemi.com/v1'
    description: production
paths:
  /export/fuelstations:
    get:
      summary: Get fuelstations by supplier id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                x-examples:
                  Example 1:
                    - id: 3255
                      iscode: IS380021
                      fuelstation_name: Due Carrare
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: fuelstation identifier
                    iscode:
                      type: string
                      description: |
                        icad store code
                    fuelstation_name:
                      type: string
                      description: feulstation name
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Unprocessable Entity (WebDAV)
        '500':
          description: Internal Server Error
      tags:
        - fuelstations
      x-internal: false
      description: Get Fuelstations by supplier id
      operationId: get-fuelstations-by-supplier-id
      parameters:
        - schema:
            type: string
          in: query
          name: supplier_id
          required: true
          description: supplier identifier
    parameters: []
  /export/circuits/fuelstations:
    get:
      summary: Get fuelstations for enabled circuits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  x-stoplight:
                    id: qpkjieelktla6
                  type: object
                  properties:
                    fuelstation_name:
                      type: string
                      x-stoplight:
                        id: fggaxgd57gj57
                    iscode:
                      type: string
                      x-stoplight:
                        id: c99cnlx7uod95
                    supplier_name:
                      type: string
                      x-stoplight:
                        id: sjac0mstt9nqc
              examples:
                Example 1:
                  value:
                    - fuelstation_name: string
                      iscode: string
                      supplier_name: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Unprocessable Entity (WebDAV)
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
      operationId: get-fuelstations-circuits
      description: Get all enabled fuelstations for enabled circuits
      parameters: []
      tags:
        - fuelstations
      x-internal: true
    parameters: []
  /export/circuits/payments:
