  /export/levels:
    get:
      summary: Get levels
      tags:
        - levels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/level'
                  x-stoplight:
                    id: 8uf4oh10oaadr
      operationId: get-export-levels
      description: Get levels
      parameters:
        - schema:
            type: integer
          in: query
          name: start_datetime
          description: start date time in unix time format (maximum interval between start and end 7 days)
          required: true
        - schema:
            type: integer
          in: query
          name: end_datetime
          description: end date time in unix time format (maximum interval between start and end 7 days)
          required: true
        - schema:
            type: integer
          in: query
          name: supplier_id
          description: supplier identifier
          required: true
        - schema:
            type: string
          in: query
          name: fuel_station_code
          description: optional fuel station code (if omitted get levels for all fuel stations)
  '/export/closure/{iscode}/{date}/{closure_type}/{turn}':
    parameters:
      - schema:
          type: string
        name: iscode
        in: path
        required: true
        description: IS code assigned to the fuel station
      - schema:
          type: string
        name: date
        in: path
        required: true
        description: Reference date on format YYYYMMDD
      - schema:
          type: string
        name: closure_type
        in: path
        required: true
        description: 'Closure type (allowed values: day, pc, turn). Recommended "day" to avoid problems with missing closures'
      - schema:
          type: string
        name: turn
        in: path
        required: true
        description: Turn number. User 0 for closure_type "day" or "pc".
    get:
      summary: Get closure for the fuel station
      tags:
        - closures
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  x-stoplight:
                    id: muyihh99jv9jo
                  type: object
                  properties:
                    incames:
                      x-stoplight:
                        id: ua4os73biysah
                      description: 'Incames with grouping amount by payment type '
                      type: array
                      items:
                        $ref: '#/components/schemas/incame'
                        x-stoplight:
                          id: 4wtxw6r2tkfzs
                    sold:
                      x-stoplight:
                        id: c4081anmr6ctr
                      description: Sold with grouped amount by product and indoor/outdoor type
                      type: array
                      items:
                        $ref: '#/components/schemas/sold'
                        x-stoplight:
                          id: t6h2ywpq0dn0k
                    totalizers:
                      x-stoplight:
                        id: afssmi75zohlx
                      description: Totalizers data
                      type: array
                      items:
                        $ref: '#/components/schemas/totalizer'
                        x-stoplight:
                          id: ljugq7enrs9lw
                    selfCash:
                      x-stoplight:
                        id: n7hf65arfjwtw
                      description: Self cash data
                      type: array
                      items:
                        $ref: '#/components/schemas/selfCash'
                        x-stoplight:
                          id: podr9c8ehokia
                    squaring:
                      $ref: '#/components/schemas/squaring'
                      x-stoplight:
                        id: apxkjcju6rmff
                      description: Squaring between sold and incames amounts
                    deliveries:
                      type: array
                      x-stoplight:
                        id: s3ow948x671w3
                      description: Deliveries with supplies and payments details
                      items:
                        $ref: '#/components/schemas/delivery'
                        x-stoplight:
                          id: j6nwvgm7z1rxn
                    cashPayments:
                      type: array
                      x-stoplight:
                        id: kpdrisjgeoyvd
                      description: Cash payments details
                      items:
                        $ref: '#/components/schemas/cashPayment'
                        x-stoplight:
                          id: zddppz6urqvee
                    incames_nonoil:
                      x-stoplight:
                        id: 2fe6p2xsuco4s
                      type: array
                      description: Incames with grouping amount by payment type for non oil
                      items:
                        $ref: '#/components/schemas/incame_nonoil'
                        x-stoplight:
                          id: g7y056r0h5mpr
                    incames_pumps_disconnected:
                      type: array
                      x-stoplight:
                        id: ux9wim7kwh3oi
                      description: Incames with grouping amount by payment type for disconnected pumps
                      items:
                        $ref: '#/components/schemas/incames_pumps_disconnected'
                        x-stoplight:
                          id: 91dlgylj97g4s
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '422':
          description: Unprocessable Entity (WebDAV)
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
      operationId: get-export-closure-iscode-date-closure_type-turn
      description: Get closure for the fuel station
  /export/closure/turns:
    get:
      summary: Get closure turns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                x-examples:
                  Example 1:
                    - fuelStation_id: 3255
                      start_datetime: '2023-01-02T00:00:00Z'
                      end_datetime: '2023-01-02T23:59:59Z'
                      turn: 0
                      in_progress: false
                items:
                  type: object
                  properties:
                    fuelStation_id:
                      type: integer
                    start_datetime:
                      type: string
                      description: |
                        start date time closure
                    end_datetime:
                      type: string
                      description: end date time closure
                    turn:
                      type: integer
                      description: turn number
                    in_progress:
                      type: boolean
                      description: if true the shift has not yet been closed and the data may var.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Unprocessable Entity (WebDAV)
        '500':
          description: Internal Server Error
      operationId: get-closure-turns
      description: Get all closure turns
      parameters:
        - schema:
            type: string
          in: query
          name: fuelstation_id
          description: fuelstation identifier
        - schema:
            type: string
          in: query
          name: closure_date
          description: format "2023-01-02"
        - schema:
            type: string
          in: query
          name: closure_type
          description: 'type "day", "turn" or "pc"'
      tags:
        - closures
      x-internal: false
    parameters: []
  /export/supplies/payments:
    get:
      summary: Your GET endpoint
      tags:
        - supplies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supplies'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Unprocessable Entity (WebDAV)
        '500':
          description: Internal Server Error
      operationId: get-supplies-payments
      description: |-
        retrieve data supply payments.
        in input if store_id is valorized then fuelstation_code can be null, other hand if fuelstation_code is valorized then store_id can be null
      parameters:
        - schema:
            type: string
          in: query
          name: fuelstation_code
          description: IS code assigned to the fuel station
        - schema:
            type: string
          in: query
          name: start_datetime
          required: true
          description: 'start date time of supplies. format ("yyyy-MM-ddThh:mm:ssZ")'
        - schema:
            type: string
          in: query
          name: end_datetime
          required: true
          description: 'end date time of supplies. format ("yyyy-MM-ddThh:mm:ssZ")'
        - schema:
            type: string
          in: query
          name: is_period_date
          required: true
          description: 'refers to the date time period: - true for the emission date; - false for the insertion date '
        - schema:
            type: string
          in: query
          name: page
          description: the page number
        - schema:
            type: string
          in: query
          name: page_size
          description: the amount of element in page
    parameters: []
